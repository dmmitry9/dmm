[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
optimizer      = true
optimizer_runs = 200
solc_version   = "0.8.24"
evm_version    = "cancun"
remappings     = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

[profile.default.rpc_endpoints]
base         = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"
