name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [claude/stoic-rosalind, claude/ecstatic-banach, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_WC_PROJECT_ID: demo
          VITE_GAME_ENGINE: "0xB32Ad5b3826a82cE3319bA38e1cBdbf1C1628c6D"
          VITE_TREASURY: "0x11e49674CE039A9fb15210e5258e0F062eF029E2"
          VITE_SEASON_NFT: "0x9b6Fcf35e4728D78107F9D9295d40629CE3c9Ce4"
          VITE_USDC: "0xb64591F38292dA40375FC9f3BAf231f26e2c3903"
          VITE_SUBGRAPH_URL: "https://api.studio.thegraph.com/query/1742958/pepe-vs-shib/v0.1.0"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
