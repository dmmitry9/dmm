name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [claude/stoic-rosalind, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_WC_PROJECT_ID: demo
          VITE_GAME_ENGINE: "0xA9D6F72F8e2d3dF9f2EF7161e6168E64d1806dBD"
          VITE_TREASURY: "0x901C708d2F1b1AD1248734482a02B3487027Ace3"
          VITE_SEASON_NFT: "0xd9C47c1007026707e198f11901d667e6463df0C8"
          VITE_USDC: "0x0ef5691F8bb3413B4C5CF3ae5A9172BC452324C2"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
