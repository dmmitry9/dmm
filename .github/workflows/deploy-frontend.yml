name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [claude/stoic-rosalind, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_WC_PROJECT_ID: demo
          VITE_GAME_ENGINE: "0x3c3c1a83FEC3b6c1fc08632CDa3bBcBD817ed854"
          VITE_TREASURY: "0x08a0E98795674818afC9e62E7865B067ed10d01F"
          VITE_SEASON_NFT: "0xDD17D19B367996c0E3628f3B819B0235C21DB6AF"
          VITE_USDC: "0x69e1eE9F18e1Eb9452fDC461343b85F75bca9c4e"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
