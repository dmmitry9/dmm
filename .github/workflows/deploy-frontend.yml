name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [claude/stoic-rosalind, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_WC_PROJECT_ID: demo
          VITE_GAME_ENGINE: "0x24CdfaB83e93f096F2234181De80EB140B405359"
          VITE_TREASURY: "0x640Bab59Fee3F99b5E50b2017826968Cd23a7F9C"
          VITE_SEASON_NFT: "0x32c3794f5fE72d95Ea478FceB11C2002564ee174"
          VITE_USDC: "0xb64591F38292dA40375FC9f3BAf231f26e2c3903"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
