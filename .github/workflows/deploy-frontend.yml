name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [claude/stoic-rosalind, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_WC_PROJECT_ID: demo
          VITE_GAME_ENGINE: "0x24224E1Aa4bF2f61d1cDc17Bfa565eC6476dFfAa"
          VITE_TREASURY: "0x5b8fDdF85ED1c06FcCF9823A4B7Eed42E4669DC6"
          VITE_SEASON_NFT: "0x5EAc9fF985D1104E5CE003c2e6Db7a1BEaA23879"
          VITE_USDC: "0x14c67F51127399Ee595de8AD92AB5B6A9a126742"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
