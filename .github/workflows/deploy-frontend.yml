name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [claude/stoic-rosalind, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_WC_PROJECT_ID: demo
          VITE_GAME_ENGINE: "0x9A6d6B625077edF9b18dFD27dA96ebFC8D742eB1"
          VITE_TREASURY: "0xB493Ae859B2f76B8402d40CD19fAA893a7faF942"
          VITE_SEASON_NFT: "0xcdC2752697416aeA5B31C2ca1F8d1F6894E59A4E"
          VITE_USDC: "0x5d5a379eE59D0EE533AB6C35D98B251e0487e45C"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
