specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  # ── GameEngine ──────────────────────────
  - kind: ethereum
    name: GameEngine
    network: base-sepolia
    source:
      address: "0xe8A5fAd5F2D12797Ae8Ac180BB6C077e0a6aD5C0"
      abi: GameEngine
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Season
        - Squad
        - Battle
        - Player
        - PlayerSeason
        - Lane
        - WeatherChange
        - SpecialEventChange
        - Activity
      abis:
        - name: GameEngine
          file: ./abis/GameEngine.json
      eventHandlers:
        - event: UnitsDeployed(indexed uint256,indexed address,uint8,uint8,uint8,uint32,uint256)
          handler: handleUnitsDeployed
        - event: SquadArrived(indexed uint256,uint8)
          handler: handleSquadArrived
        - event: Retreated(indexed uint256,indexed address,uint256,uint256)
          handler: handleRetreated
        - event: BattleResolved(indexed uint8,uint8,uint256,uint256,uint256)
          handler: handleBattleResolved
        - event: SeasonStarted(indexed uint256,uint256)
          handler: handleSeasonStarted
        - event: SeasonEnded(indexed uint256,uint8,address[3])
          handler: handleSeasonEnded
        - event: WeatherChanged(uint8)
          handler: handleWeatherChanged
        - event: SpecialEventStarted(uint8,uint256)
          handler: handleSpecialEventStarted
        - event: HoldScoreUpdated(uint8,uint128,uint128)
          handler: handleHoldScoreUpdated
        - event: ZombieCleaned(indexed uint256,uint256)
          handler: handleZombieCleaned
      file: ./src/game-engine.ts

  # ── Treasury ────────────────────────────
  - kind: ethereum
    name: Treasury
    network: base-sepolia
    source:
      address: "0x11e49674CE039A9fb15210e5258e0F062eF029E2"
      abi: Treasury
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Season
        - Player
        - PlayerSeason
        - TreasuryState
        - Activity
      abis:
        - name: Treasury
          file: ./abis/Treasury.json
      eventHandlers:
        - event: SeasonFinalized(indexed uint256,uint8,uint256)
          handler: handleSeasonFinalized
        - event: SeasonClaimed(indexed uint256,indexed address,uint256)
          handler: handleSeasonClaimed
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn
        - event: TreasurySeeded(indexed uint256,uint256)
          handler: handleTreasurySeeded
        - event: TreasuryDonation(indexed uint256,indexed address,uint256)
          handler: handleTreasuryDonation
        - event: KillRewardDistributed(indexed uint8,uint8,uint256)
          handler: handleKillRewardDistributed
        - event: PartialKillRewardDistributed(indexed uint8,uint8,uint256,uint256)
          handler: handlePartialKillRewardDistributed
        - event: RetreatRefunded(indexed address,uint256,uint8,uint8)
          handler: handleRetreatRefunded
      file: ./src/treasury.ts

  # ── SeasonNFT ───────────────────────────
  - kind: ethereum
    name: SeasonNFT
    network: base-sepolia
    source:
      address: "0x9b6Fcf35e4728D78107F9D9295d40629CE3c9Ce4"
      abi: SeasonNFT
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - SeasonNFTToken
        - Player
        - Season
        - Activity
      abis:
        - name: SeasonNFT
          file: ./abis/SeasonNFT.json
      eventHandlers:
        - event: SeasonNFTMinted(indexed uint256,indexed uint256,uint8,uint8,indexed address)
          handler: handleSeasonNFTMinted
      file: ./src/season-nft.ts
